<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tinambac Fish Market - Online Ordering System</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #0077b6;
            --primary-dark: #023e8a;
            --accent: #00b4d8;
            --bg: #f4f6f8;
            --text: #1d2d44;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); line-height: 1.6; }

        header {
            background-color: var(--primary-dark);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .cart-bar {
            background-color: var(--primary);
            color: white;
            padding: 0.75rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-cart {
            background-color: #ffb703;
            color: #000;
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }

        /* Filter Tabs */
        .category-tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; overflow-x: auto; padding-bottom: 0.5rem; }
        .tab-btn {
            background: #e0e1dd;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            white-space: nowrap;
        }
        .tab-btn.active { background: var(--primary); color: white; }

        /* Product Grid */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.5rem; }
        .card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.08); display: flex; flex-direction: column; }
        .card img { width: 100%; height: 180px; object-fit: cover; background-color: #e9ecef; }
        .card-body { padding: 1rem; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 0.25rem; }
        .vendor-tag { font-size: 0.85rem; color: #6c757d; margin-bottom: 0.5rem; }
        .price { font-size: 1.1rem; color: var(--primary); font-weight: bold; margin-bottom: 1rem; }

        .btn-add { background: var(--primary); color: white; border: none; padding: 0.6rem; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn-add:hover { background: var(--primary-dark); }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-body { background: white; padding: 2rem; border-radius: 8px; width: 95%; max-width: 550px; max-height: 90vh; overflow-y: auto; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 0.25rem; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; }
        .close-btn { background: #dc3545; color: white; border: none; padding: 0.4rem 0.8rem; border-radius: 4px; float: right; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <h2>🐟 Tinambac Market Online</h2>
</header>

<div class="cart-bar">
    <span>Fresh fish directly from local vendors in Tinambac, Camarines Sur</span>
    <button class="btn-cart" onclick="openCartModal()">🛒 Cart (<span id="cart-count">0</span>)</button>
</div>

<div class="container">
    <h3 style="margin-bottom: 1rem;">Browse Categories</h3>
    <div id="category-tabs" class="category-tabs">
        <button class="tab-btn active" onclick="filterCategory('all')">All Products</button>
    </div>

    <h3 style="margin-bottom: 1rem;">Available Fresh Products</h3>
    <div id="product-grid" class="product-grid">
        <p>Loading catalog from database...</p>
    </div>
</div>

<!-- Order Modal -->
<div id="cart-modal" class="modal">
    <div class="modal-body">
        <button class="close-btn" onclick="closeCartModal()">✕</button>
        <h3>Checkout & Delivery Details</h3>
        
        <div id="cart-summary" style="margin: 1rem 0; padding: 1rem; background: #e9ecef; border-radius: 4px;"></div>
        
        <form id="checkout-form" onsubmit="handleCheckout(event)">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="cust-name" required placeholder="Ana Boriga">
            </div>
            <div class="form-group">
                <label>Contact Number</label>
                <input type="tel" id="cust-phone" required placeholder="09123456789">
            </div>
            <div class="form-group">
                <label>Barangay</label>
                <input type="text" id="cust-barangay" required placeholder="Poblacion, Tinambac">
            </div>
            <div class="form-group">
                <label>Detailed Delivery Address / Landmark</label>
                <textarea id="cust-address" rows="2" required placeholder="Near Plaza / Stall Area"></textarea>
            </div>
            <div class="form-group">
                <label>Payment Method</label>
                <select id="payment-method" required>
                    <option value="cash_on_delivery">Cash on Delivery (COD)</option>
                    <option value="gcash">GCash Transfer</option>
                </select>
            </div>
            <button type="submit" class="btn-add" style="background-color: #28a745;">Submit Order</button>
        </form>
    </div>
</div>

<script>
    // Initialize Supabase Client
    const SUPABASE_URL = 'https://eyflalxgkqekrebzxxra.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Ha8tHUn1V9aa5OPuZNY8tQ_e8wJWK_b'; 
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allProducts = [];
    let cart = [];

    async function loadData() {
        await fetchCategories();
        await fetchProducts();
    }

    async function fetchCategories() {
        const { data, error } = await supabase.from('categories').select('*');
        if (!error && data) {
            const tabs = document.getElementById('category-tabs');
            data.forEach(c => {
                const btn = document.createElement('button');
                btn.className = 'tab-btn';
                btn.innerText = c.name;
                btn.onclick = () => filterCategory(c.id);
                tabs.appendChild(btn);
            });
        }
    }

    async function fetchProducts() {
        const { data, error } = await supabase
            .from('products')
            .select('*, vendors(store_name, stall_number)')
            .eq('is_available', true);

        if (error) {
            console.error(error);
            document.getElementById('product-grid').innerHTML = '<p>Error loading products.</p>';
            return;
        }

        allProducts = data || [];
        renderProducts(allProducts);
    }

    function renderProducts(products) {
        const grid = document.getElementById('product-grid');
        if (products.length === 0) {
            grid.innerHTML = '<p>No items found in this category.</p>';
            return;
        }

        grid.innerHTML = products.map(p => `
            <div class="card">
                <img src="${p.image_url || 'https://via.placeholder.com/300x180?text=Fresh+Fish'}" alt="${p.name}">
                <div class="card-body">
                    <div class="card-title">${p.name}</div>
                    <div class="vendor-tag">Vendor: ${p.vendors ? p.vendors.store_name : 'Tinambac Vendor'}</div>
                    <div class="price">₱${parseFloat(p.price).toFixed(2)} / kg</div>
                    <button class="btn-add" onclick="addToCart('${p.id}')">Add to Cart</button>
                </div>
            </div>
        `).join('');
    }

    function filterCategory(catId) {
        if (catId === 'all') {
            renderProducts(allProducts);
        } else {
            renderProducts(allProducts.filter(p => p.category_id === catId));
        }
    }

    function addToCart(productId) {
        const product = allProducts.find(p => p.id === productId);
        if (!product) return;

        const existing = cart.find(item => item.id === productId);
        if (existing) {
            existing.qty += 1;
        } else {
            cart.push({ id: product.id, name: product.name, price: product.price, qty: 1 });
        }
        updateCartCount();
    }

    function updateCartCount() {
        document.getElementById('cart-count').innerText = cart.reduce((sum, item) => sum + item.qty, 0);
    }

    function openCartModal() {
        const summary = document.getElementById('cart-summary');
        if (cart.length === 0) {
            summary.innerHTML = '<p>Cart is currently empty.</p>';
        } else {
            let total = 0;
            summary.innerHTML = cart.map(item => {
                const sub = item.price * item.qty;
                total += sub;
                return `<div>${item.name} - ${item.qty} kg @ ₱${item.price} = <strong>₱${sub.toFixed(2)}</strong></div>`;
            }).join('') + `<hr><div style="margin-top:0.5rem;"><strong>Total Amount: ₱${total.toFixed(2)}</strong></div>`;
        }
        document.getElementById('cart-modal').style.display = 'flex';
    }

    function closeCartModal() {
        document.getElementById('cart-modal').style.display = 'none';
    }

    async function handleCheckout(e) {
        e.preventDefault();
        if (cart.length === 0) {
            alert('Please add products to your cart before placing an order.');
            return;
        }

        const name = document.getElementById('cust-name').value;
        const phone = document.getElementById('cust-phone').value;
        const barangay = document.getElementById('cust-barangay').value;
        const address = document.getElementById('cust-address').value;
        const paymentMethod = document.getElementById('payment-method').value;

        const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

        try {
            // 1. Create/Insert Customer
            const { data: customer, error: custErr } = await supabase
                .from('customers')
                .insert([{ name, phone }])
                .select().single();
            if (custErr) throw custErr;

            // 2. Insert Delivery Address
            const { data: addr, error: addrErr } = await supabase
                .from('delivery_addresses')
                .insert([{ customer_id: customer.id, barangay, address_line: address }])
                .select().single();
            if (addrErr) throw addrErr;

            // 3. Insert Main Order
            const { data: order, error: orderErr } = await supabase
                .from('orders')
                .insert([{ customer_id: customer.id, delivery_address_id: addr.id, total_amount: totalAmount, status: 'pending' }])
                .select().single();
            if (orderErr) throw orderErr;

            // 4. Insert Order Items
            const items = cart.map(item => ({
                order_id: order.id,
                product_id: item.id,
                quantity: item.qty,
                price: item.price
            }));
            const { error: itemsErr } = await supabase.from('order_items').insert(items);
            if (itemsErr) throw itemsErr;

            // 5. Insert Payment Record
            await supabase.from('payments').insert([{
                order_id: order.id,
                amount: totalAmount,
                payment_method: paymentMethod,
                status: 'pending'
            }]);

            // 6. Insert System Notification for Vendors
            await supabase.from('notifications').insert([{
                title: 'New Order Received',
                message: `Order #${order.id.slice(0,8)} placed by ${name} for ₱${totalAmount.toFixed(2)}`
            }]);

            alert('Order placed successfully! Vendors will be notified.');
            cart = [];
            updateCartCount();
            closeCartModal();

        } catch (err) {
            console.error('Checkout failed:', err);
            alert('Failed to submit order. Please verify table permissions or console logs.');
        }
    }

    window.onload = loadData;
</script>
</body>
</html>
