<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tinambac Market Online - Online Ordering System</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --header-bg: #003e7e;
            --sub-bg: #007bb6;
            --accent-yellow: #ffc107;
            --bg-light: #f4f6f9;
            --text-dark: #212529;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); line-height: 1.5; }

        header {
            background-color: var(--header-bg);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 { font-size: 1.5rem; font-weight: bold; }
        .auth-controls button { background: transparent; border: 1px solid white; color: white; padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer; margin-left: 0.5rem; font-weight: 600; }
        .auth-controls button:hover { background: white; color: var(--header-bg); }

        .sub-header {
            background-color: var(--sub-bg);
            color: white;
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-btn {
            background-color: var(--accent-yellow);
            color: #000;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .main-content { max-width: 1100px; margin: 2rem auto; padding: 0 1.5rem; }

        .section-title { font-size: 1.3rem; font-weight: bold; margin-bottom: 1rem; color: #111; }

        .category-tabs { display: flex; gap: 0.5rem; margin-bottom: 2rem; flex-wrap: wrap; }
        .category-btn {
            background: #0077b6;
            color: white;
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        .category-btn.active { background: #002b5b; }

        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.5rem; }
        .product-card { background: white; border-radius: 8px; border: 1px solid #e0e0e0; overflow: hidden; display: flex; flex-direction: column; }
        .product-card img { width: 100%; height: 180px; object-fit: cover; background: #eee; }
        .card-body { padding: 1rem; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .product-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 0.25rem; }
        .vendor-info { font-size: 0.85rem; color: #666; margin-bottom: 0.5rem; }
        .product-price { font-size: 1.1rem; font-weight: bold; color: #0077b6; margin-bottom: 1rem; }

        .btn-action { background-color: #0077b6; color: white; border: none; padding: 0.6rem; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; }
        .btn-action:hover { background-color: #005689; }

        /* Modal Windows */
        .modal-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-box { background: white; padding: 2rem; border-radius: 8px; width: 95%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 0.3rem; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .close-modal { background: none; border: none; font-size: 1.5rem; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <h1>🐟 Tinambac Market Online</h1>
    <div class="auth-controls" id="auth-controls">
        <button onclick="openModal('login-modal')">Login / Sign Up</button>
    </div>
</header>

<div class="sub-header">
    <span>Fresh fish directly from local vendors in Tinambac, Camarines Sur</span>
    <button class="cart-btn" onclick="openModal('cart-modal')">🛒 Cart (<span id="cart-count">0</span>)</button>
</div>

<main class="main-content">
    <h2 class="section-title">Browse Categories</h2>
    <div class="category-tabs" id="category-tabs">
        <button class="category-btn active" onclick="filterProducts('all')">All Products</button>
    </div>

    <h2 class="section-title">Available Fresh Products</h2>
    <div class="product-grid" id="product-grid">
        <p>Loading catalog from database...</p>
    </div>
</main>

<!-- Cart & Checkout Modal -->
<div class="modal-overlay" id="cart-modal">
    <div class="modal-box">
        <div class="modal-header">
            <h3>Your Order Cart</h3>
            <button class="close-modal" onclick="closeModal('cart-modal')">&times;</button>
        </div>
        <div id="cart-items-list" style="margin-bottom: 1rem;"></div>
        <hr style="margin-bottom: 1rem;">
        <h4>Delivery Information</h4>
        <form onsubmit="handleCheckout(event)">
            <div class="form-group">
                <label>Customer Name</label>
                <input type="text" id="cust-name" required placeholder="e.g. Ana Boriga">
            </div>
            <div class="form-group">
                <label>Contact Phone Number</label>
                <input type="tel" id="cust-phone" required placeholder="09123456789">
            </div>
            <div class="form-group">
                <label>Barangay (Tinambac)</label>
                <input type="text" id="cust-barangay" required placeholder="e.g. Poblacion">
            </div>
            <div class="form-group">
                <label>Delivery Address / Specific Stall</label>
                <textarea id="cust-address" rows="2" required placeholder="Detailed location / landmark"></textarea>
            </div>
            <button type="submit" class="btn-action" style="background:#28a745;">Place Order Now</button>
        </form>
    </div>
</div>

<!-- Login / Account Modal -->
<div class="modal-overlay" id="login-modal">
    <div class="modal-box">
        <div class="modal-header">
            <h3>Account Access</h3>
            <button class="close-modal" onclick="closeModal('login-modal')">&times;</button>
        </div>
        <form onsubmit="handleAuth(event)">
            <div class="form-group">
                <label>Account Type</label>
                <select id="user-role">
                    <option value="customer">Customer</option>
                    <option value="vendor">Vendor / Seller</option>
                </select>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="auth-email" required placeholder="user@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="auth-password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-action">Login / Register</button>
        </form>
    </div>
</div>

<script>
    // 1. Initialize Supabase Client
    const SUPABASE_URL = 'https://eyflalxgkqekrebzxxra.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Ha8tHUn1V9aa5OPuZNY8tQ_e8wJWK_b'; // Replace with your anon key from Supabase Dashboard -> Settings -> API
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allProducts = [];
    let cart = [];

    // 2. Initialize Page
    document.addEventListener('DOMContentLoaded', () => {
        loadCategories();
        loadProducts();
    });

    // 3. Fetch Categories from Supabase
    async function loadCategories() {
        const { data, error } = await supabase.from('categories').select('*');
        if (!error && data) {
            const container = document.getElementById('category-tabs');
            data.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'category-btn';
                btn.innerText = cat.name;
                btn.onclick = () => filterProducts(cat.id);
                container.appendChild(btn);
            });
        }
    }

    // 4. Fetch Products from Supabase
    async function loadProducts() {
        const grid = document.getElementById('product-grid');
        const { data, error } = await supabase
            .from('products')
            .select('*, vendors(store_name, stall_number)')
            .eq('is_available', true);

        if (error) {
            console.error(error);
            grid.innerHTML = '<p>Error connecting to Supabase database. Please verify API key and permissions.</p>';
            return;
        }

        allProducts = data || [];
        renderProductGrid(allProducts);
    }

    // 5. Render Product Cards
    function renderProductGrid(products) {
        const grid = document.getElementById('product-grid');
        if (products.length === 0) {
            grid.innerHTML = '<p>No items found.</p>';
            return;
        }

        grid.innerHTML = products.map(p => `
            <div class="product-card">
                <img src="${p.image_url || 'https://via.placeholder.com/260x180?text=Fresh+Fish'}" alt="${p.name}">
                <div class="card-body">
                    <div>
                        <div class="product-title">${p.name}</div>
                        <div class="vendor-info">Seller: ${p.vendors ? p.vendors.store_name : 'Tinambac Vendor'}</div>
                        <div class="product-price">₱${parseFloat(p.price).toFixed(2)} / kg</div>
                    </div>
                    <button class="btn-action" onclick="addToCart('${p.id}')">Add to Cart</button>
                </div>
            </div>
        `).join('');
    }

    // 6. Filter Logic
    function filterProducts(catId) {
        if (catId === 'all') {
            renderProductGrid(allProducts);
        } else {
            renderProductGrid(allProducts.filter(p => p.category_id === catId));
        }
    }

    // 7. Cart Functionality
    function addToCart(productId) {
        const prod = allProducts.find(p => p.id === productId);
        if (!prod) return;

        const existing = cart.find(i => i.id === productId);
        if (existing) {
            existing.qty += 1;
        } else {
            cart.push({ id: prod.id, name: prod.name, price: prod.price, qty: 1 });
        }

        updateCartUI();
        alert(`${prod.name} added to cart!`);
    }

    function updateCartUI() {
        const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
        document.getElementById('cart-count').innerText = totalItems;

        const list = document.getElementById('cart-items-list');
        if (cart.length === 0) {
            list.innerHTML = '<p>Cart is empty.</p>';
            return;
        }

        let grandTotal = 0;
        list.innerHTML = cart.map(item => {
            const sub = item.price * item.qty;
            grandTotal += sub;
            return `<div><strong>${item.name}</strong> - ${item.qty} kg @ ₱${item.price} = ₱${sub.toFixed(2)}</div>`;
        }).join('') + `<br><div><strong>Total: ₱${grandTotal.toFixed(2)}</strong></div>`;
    }

    // 8. Order Submission
    async function handleCheckout(e) {
        e.preventDefault();
        if (cart.length === 0) {
            alert('Your cart is empty!');
            return;
        }

        const name = document.getElementById('cust-name').value;
        const phone = document.getElementById('cust-phone').value;
        const barangay = document.getElementById('cust-barangay').value;
        const address = document.getElementById('cust-address').value;
        const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

        try {
            // Save Customer
            const { data: customer, error: cErr } = await supabase
                .from('customers')
                .insert([{ name, phone }])
                .select().single();
            if (cErr) throw cErr;

            // Save Address
            const { data: addr, error: aErr } = await supabase
                .from('delivery_addresses')
                .insert([{ customer_id: customer.id, barangay, address_line: address }])
                .select().single();
            if (aErr) throw aErr;

            // Create Order
            const { data: order, error: oErr } = await supabase
                .from('orders')
                .insert([{ customer_id: customer.id, delivery_address_id: addr.id, total_amount: totalAmount, status: 'pending' }])
                .select().single();
            if (oErr) throw oErr;

            // Create Order Items
            const items = cart.map(item => ({
                order_id: order.id,
                product_id: item.id,
                quantity: item.qty,
                price: item.price
            }));
            const { error: iErr } = await supabase.from('order_items').insert(items);
            if (iErr) throw iErr;

            alert('Order placed successfully!');
            cart = [];
            updateCartUI();
            closeModal('cart-modal');

        } catch (err) {
            console.error(err);
            alert('Failed to place order. Ensure SQL script in Step 1 was executed in Supabase.');
        }
    }

    // 9. Login/Auth Handling
    async function handleAuth(e) {
        e.preventDefault();
        const email = document.getElementById('auth-email').value;
        const password = document.getElementById('auth-password').value;

        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) {
            // If user doesn't exist, try signing up
            const { data: signUpData, error: signUpErr } = await supabase.auth.signUp({ email, password });
            if (signUpErr) {
                alert('Auth error: ' + signUpErr.message);
                return;
            }
            alert('Account created and logged in!');
        } else {
            alert('Logged in successfully!');
        }
        closeModal('login-modal');
    }

    // Helper Modal Functions
    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
</script>
</body>
</html>
